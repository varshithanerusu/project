<!DOCTYPE html>
<html>

<head>
    <title>Add Course</title>
</head>

<body>

    <h1>Add Course</h1>

    <hr>

    <form action="/courses" method="POST">

        <label>Course Name:</label>

        <input
            type="text"
            name="name"
            required
        >

        <br><br>

        <label>Course Code:</label>

        <input
            type="text"
            name="code"
            required
        >

        <br><br>

        <button type="submit">
            Add Course
        </button>

    </form>

    <br>

    <a href="/courses">
        Back to Courses
    </a>

</body>

</html>
