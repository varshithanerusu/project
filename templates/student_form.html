<!DOCTYPE html>
<html>

<head>
    <title>Add Student</title>
</head>

<body>

    <h1>Add Student</h1>

    <form action="/students" method="POST">

        <label>Name:</label>

        <input
            type="text"
            name="name"
            required
        >

        <br><br>

        <label>Email:</label>

        <input
            type="email"
            name="email"
            required
        >

        <br><br>

        <button type="submit">
            Add Student
        </button>

    </form>

    <br>

    <a href="/students">
        Back to Students
    </a>

</body>

</html>
