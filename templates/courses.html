<!DOCTYPE html>
<html>

<head>
    <title>Courses</title>
</head>

<body>

    <h1>Student Performance Analytics System</h1>

    <h2>Courses</h2>

    <a href="{{ url_for('new_course') }}">
        Add New Course
    </a>

    <br><br>

    {% if courses %}

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Course Name</th>
            <th>Course Code</th>
            <th>Actions</th>
        </tr>

        {% for course in courses %}

        <tr>

            <td>
                {{ course.id }}
            </td>

            <td>
                {{ course.name }}
            </td>

            <td>
                {{ course.code }}
            </td>

            <td>

                <a href="{{ url_for('course_detail', id=course.id) }}">
                    View
                </a>

                |

                <a href="{{ url_for('edit_course', id=course.id) }}">
                    Edit
                </a>

                |

                <form
                    action="{{ url_for('delete_course', id=course.id) }}"
                    method="POST"
                    style="display:inline;"
                >

                    <button
                        type="submit"
                        onclick="return confirm('Are you sure you want to delete this course?')"
                    >
                        Delete
                    </button>

                </form>

            </td>

        </tr>

        {% endfor %}

    </table>

    {% else %}

    <p>No courses found.</p>

    {% endif %}

    <br>

    <a href="/students">
        Go to Students
    </a>

</body>

</html>
