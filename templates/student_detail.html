<!DOCTYPE html>
<html>

<head>
    <title>Student Details</title>
</head>

<body>

    <h1>Student Details</h1>

    <hr>

    <p>
        <strong>ID:</strong>
        {{ student.id }}
    </p>

    <p>
        <strong>Name:</strong>
        {{ student.name }}
    </p>

    <p>
        <strong>Email:</strong>
        {{ student.email }}
    </p>

    <br>

    <a href="{{ url_for('edit_student', id=student.id) }}">
        Edit Student
    </a>

    <br><br>

    <a href="{{ url_for('students') }}">
        Back to Students
    </a>
<form
    method="POST"
    action="/students/{{ student.id }}"
    onsubmit="return confirm('Are you sure you want to delete this student?');"
>

    <input
        type="hidden"
        name="_method"
        value="DELETE"
    >

    <button type="submit">
        Delete Student
    </button>

</form>
</body>

</html>
