<!DOCTYPE html>
<html>

<head>
    <title>Course Details</title>
</head>

<body>

    <h1>Course Details</h1>

    <hr>

    <p>
        <strong>ID:</strong>
        {{ course.id }}
    </p>

    <p>
        <strong>Course Name:</strong>
        {{ course.name }}
    </p>

    <p>
        <strong>Course Code:</strong>
        {{ course.code }}
    </p>

    <br>

    <a href="{{ url_for('edit_course', id=course.id) }}">
        Edit Course
    </a>

    <br><br>

    <a href="{{ url_for('courses') }}">
        Back to Courses
    </a>

</body>

</html>
